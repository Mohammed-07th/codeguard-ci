[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeguard-ci"
version = "0.1.0"
description = "Agentic code-review and secrets-scanning system for CI pipelines"
requires-python = ">=3.11"
# Runtime dependencies are pinned in requirements.txt; this file exists so
# `import codeguard` resolves identically from scripts, the notebook and Docker.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# arize-phoenix-client registers a pytest11 plugin that raises on import under
# Python 3.11 ("mutable default mappingproxy"), which aborts the run before
# collection. Disabling it costs nothing: we use Phoenix for tracing, not tests.
addopts = "-q -p no:phoenix"

# NOTE: deliberately no [tool.ruff] section. The StyleAgent invokes ruff with
# --isolated and an explicit rule selection so its findings are reproducible and
# never depend on ambient project configuration.
